<div class="dashboard">

  <div class="card tank-card">
    <h4>Water Level</h4>
    <div class="tank">
      <div id="water"></div>
    </div>
    <p id="levelText">50%</p>
  </div>

  <div class="card">
    <h4>Temperature</h4>
    <canvas id="gaugeTemp"></canvas>
  </div>

  <div class="card">
    <h4>Humidity</h4>
    <canvas id="gaugeHum"></canvas>
  </div>

  <div class="card">
    <h4>Pump</h4>
    <div id="fan"></div>
    <p id="pumpStatus">OFF</p>
  </div>

  <div class="card">
    <h4>Status</h4>
    <div id="alarm">NORMAL</div>
  </div>

  <div class="card chart-card">
    <canvas id="chart"></canvas>
  </div>

</div>
