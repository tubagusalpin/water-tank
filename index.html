<!-- ================= index.html ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Tank Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="header">Water Tank</div>

<div class="dashboard">

    <!-- TOP CARDS -->
    <div class="card big">
        <h4>Water Volume</h4>
        <div class="circle">1558<br><span>Liter</span></div>
    </div>

    <div class="card">
        <h4>Water Level</h4>
        <div class="vertical-bar"></div>
        <p>75 cm</p>
    </div>

    <div class="card">
        <h4>Distance</h4>
        <div class="vertical-bar red"></div>
        <p>50 cm</p>
    </div>

    <div class="card small">
        <h4>Temperature</h4>
        <canvas id="tempGauge"></canvas>
    </div>

    <div class="card small">
        <h4>Humidity</h4>
        <canvas id="humGauge"></canvas>
    </div>

    <div class="card small">
        <h4>Battery</h4>
        <canvas id="batGauge"></canvas>
    </div>

    <div class="card small">
        <h4>WiFi</h4>
        <canvas id="wifiGauge"></canvas>
    </div>

    <!-- CHARTS -->
    <div class="card chart wide"><canvas id="chart1"></canvas></div>
    <div class="card chart wide"><canvas id="chart2"></canvas></div>
    <div class="card chart wide"><canvas id="chart3"></canvas></div>
    <div class="card chart wide"><canvas id="chart4"></canvas></div>

</div>

<script src="script.js"></script>
</body>
</html>
