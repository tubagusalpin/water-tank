<!-- ================= HTML (index.html) ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Monitoring Tangki Air</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>SCADA MONITORING TANGKI AIR</h1>

<div class="container">

    <!-- ROW ATAS (5 ITEM SESUAI GAMBAR) -->

    <div class="card">
        <h3>Water Level</h3>
        <div class="tank">
            <div class="water" id="water"></div>
        </div>
        <p id="levelText">60%</p>
    </div>

    <div class="card">
        <h3>Temperature</h3>
        <p id="temp">30°C</p>
        <div class="status-bar"></div>
    </div>

    <div class="card">
        <h3>Humidity</h3>
        <p id="hum">70%</p>
        <div class="status-bar"></div>
    </div>

    <div class="card">
        <h3>Pump</h3>
        <div class="circle"></div>
    </div>

    <div class="card">
        <h3>Status Pump</h3>
        <div class="pump-box">
            <button class="pump-btn" id="pumpBtn" onclick="togglePump()">Status</button>
        </div>
    </div>

    <!-- ROW BAWAH (3 GRAFIK) -->

    <div class="card chart-card">
        <h3>Water Level</h3>
        <div class="chart"></div>
    </div>

    <div class="card chart-card">
        <h3>Temperature</h3>
        <div class="chart"></div>
    </div>

    <div class="card chart-card">
        <h3>Humidity</h3>
        <div class="chart"></div>
    </div>

</div>

<script src="script.js"></script>
</html>
