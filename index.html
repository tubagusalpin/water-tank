<!DOCTYPE html>
<html>
<head>
  <title>SCADA Tank FINAL</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>SCADA MONITORING TANGKI AIR</h2>

<div class="dashboard">

  <!-- TANK -->
  <div class="tank-card card">
    <h4>Water Level</h4>
    <div class="tank">
      <div id="water"></div>
    </div>
    <p id="levelText">50%</p>
  </div>

  <!-- GAUGE BESAR -->
  <div class="card gauge-big">
    <h4>Temperature</h4>
    <div class="gaugeBox">
      <canvas id="gaugeTemp"></canvas>
      <span id="tempText">0°C</span>
    </div>
  </div>

  <div class="card gauge-big">
    <h4>Humidity</h4>
    <div class="gaugeBox">
      <canvas id="gaugeHum"></canvas>
      <span id="humText">0%</span>
    </div>
  </div>

  <!-- POMPA -->
  <div class="card">
    <h4>Pump</h4>
    <div id="fan"></div>
    <p id="pumpStatus">OFF</p>
  </div>

  <!-- STATUS -->
  <div class="card">
    <h4>Status</h4>
    <div id="alarm">NORMAL</div>
  </div>

  <!-- GRAFIK -->
  <div class="card chart">
    <h4>Water Level</h4>
    <canvas id="chartLevel"></canvas>
  </div>

  <div class="card chart">
    <h4>Temperature</h4>
    <canvas id="chartTemp"></canvas>
  </div>

  <div class="card chart">
    <h4>Humidity</h4>
    <canvas id="chartHum"></canvas>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
